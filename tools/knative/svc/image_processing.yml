---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aerofb-image-processing
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/ckatsak/aerofb-image_processing:0.0.1
          ports:
            - containerPort: 8000
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aerofb-image-processing-fc
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/ckatsak/aerofb-image_processing:0.0.1
          ports:
            - containerPort: 8000
      runtimeClassName: kata-fc
