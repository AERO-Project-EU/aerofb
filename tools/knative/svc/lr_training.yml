---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aerofb-lr-training
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/ckatsak/aerofb-lr_training:0.0.1
          ports:
            - containerPort: 8000
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aerofb-lr-training-fc
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/ckatsak/aerofb-lr_training:0.0.1
          ports:
            - containerPort: 8000
      runtimeClassName: kata-fc
